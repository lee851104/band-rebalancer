<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>板塊清單的三種呈現</title>
<style>
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --border: rgba(255,255,255,.10);
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --good: #0ca30c; --bad: #e5484d; --buy: #3987e5;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 16px 56px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  .lead { margin: 0 0 18px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
  .opt { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; }
  .opt > h2 { margin: 0 0 2px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .opt > h2 .n { width: 24px; height: 24px; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; font-size: 12.5px; color: var(--ink-2); }
  .opt > p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .tip { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 10px; }

  /* 共用：股票字塊 */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .hchip { display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
  .hchip b { font-weight: 750; letter-spacing: .02em; }
  .hchip small { color: var(--muted); font-size: 12px; }
  .hchip em { font-style: normal; font-weight: 750; font-size: 12px; padding: 1px 7px; border-radius: 999px; background: rgba(229,72,77,.2); color: var(--bad); }
  .hchip.has-t { border-color: rgba(229,72,77,.5); }

  /* 1. 色塊卡片 */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { border: 0; border-radius: 14px; padding: 12px 10px; text-align: left; cursor: pointer; background: rgba(12,163,12,.14); outline: 2px solid transparent; transition: outline-color .15s, transform .15s; }
  .tile:hover { transform: translateY(-1px); }
  .tile.on { outline-color: var(--ink-2); }
  .tile.bad { background: rgba(229,72,77,.18); }
  .tile.low { background: rgba(57,135,229,.18); }
  .tile .nm { display: flex; align-items: center; gap: 6px; font-weight: 650; font-size: 14px; }
  .tile .nm i { width: 8px; height: 8px; border-radius: 50%; }
  .tile .big { font-size: 28px; font-weight: 800; line-height: 1.15; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile .st { font-size: 12.5px; font-weight: 700; color: var(--good); }
  .tile.bad .st { color: var(--bad); }
  .tile.low .st { color: var(--buy); }
  .tile .tg { font-size: 11.5px; color: var(--muted); }
  .tile-detail { margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--page); border: 1px solid var(--border); }
  .tile-detail h3 { margin: 0; font-size: 14px; }

  /* 2. 只說差多少 */
  .dlist { display: grid; gap: 2px; }
  .drow { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border: 0; background: none; border-radius: 12px; cursor: pointer; text-align: left; }
  .drow:hover, .drow.on { background: var(--surface-2); }
  .drow i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .drow .nm { flex: 1; font-weight: 650; font-size: 16px; }
  .dchip { padding: 5px 14px; border-radius: 999px; font-weight: 750; font-size: 14px; }
  .dchip.ok { background: rgba(12,163,12,.18); color: #5fd35f; }
  .dchip.bad { background: rgba(229,72,77,.2); color: #ff8a8d; }
  .dchip.low { background: rgba(57,135,229,.2); color: #8cc2ff; }
  .ddetail { padding: 0 10px 12px 32px; }

  /* 3. 分成兩組 */
  .grp h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 650; letter-spacing: .04em; }
  .grp + .grp { margin-top: 18px; }
  .todo { border-radius: 14px; padding: 14px; background: rgba(229,72,77,.12); border: 1px solid rgba(229,72,77,.4); }
  .todo + .todo { margin-top: 8px; }
  .todo .hd { display: flex; align-items: center; gap: 8px; }
  .todo .hd i { width: 10px; height: 10px; border-radius: 50%; }
  .todo .hd b { font-size: 17px; }
  .todo .hd span { margin-left: auto; font-weight: 750; color: var(--bad); }
  .okchips { display: flex; flex-wrap: wrap; gap: 8px; }
  .okchip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; background: rgba(12,163,12,.14); border: 1px solid rgba(12,163,12,.35); font-weight: 650; cursor: pointer; }
  .okchip i { width: 8px; height: 8px; border-radius: 50%; }
  .okchip .ck { color: #5fd35f; }
  .okdetail { margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--page); border: 1px solid var(--border); }

  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; max-width: 520px; margin: 0 auto; } }
  @media (max-width: 420px) { .tiles { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>下面的板塊清單：三種呈現方式</h1>
  <p class="lead">同一份範例資料（只有半導體太多）。每種都可以點，看點開後的樣子。</p>
  <div class="grid">
    <section class="opt">
      <h2><span class="n">1</span>色塊卡片</h2>
      <p>綠色＝剛好、紅色＝太多、藍色＝太少，找紅色的就好</p>
      <div class="tiles" id="o1"></div>
      <div id="o1d"></div>
    </section>
    <section class="opt">
      <h2><span class="n">2</span>只說差多少</h2>
      <p>每個板塊只有一個字塊：剛好 / 多 6% / 少 3%</p>
      <div class="dlist" id="o2"></div>
    </section>
    <section class="opt">
      <h2><span class="n">3</span>分成兩組</h2>
      <p>上面只放要處理的，下面是不用動的名字</p>
      <div id="o3"></div>
    </section>
  </div>
  <p class="tip">範例資料，數字是虛構的</p>
</div>
<script>
(() => {
  const TOL = 5;
  const SECTORS = [
    { id: 'rocket', name: '火箭', target: 15, w: 17.2, hold: [['RKLB', 1000], ['LUNR', 1500]] },
    { id: 'optics', name: '光', target: 15, w: 13.0, hold: [['COHR', 250], ['LITE', 125]] },
    { id: 'software', name: '軟體', target: 20, w: 18.4, hold: [['MSFT', 50], ['CRM', 80]] },
    { id: 'ev', name: '電動車', target: 15, w: 11.6, hold: [['TSLA', 50], ['RIVN', 500]] },
    { id: 'health', name: '醫療', target: 15, w: 13.4, hold: [['LLY', 30], ['ISRG', 19]] },
    { id: 'semis', name: '半導體', target: 20, w: 26.4, hold: [['NVDA', 200, 11], ['TSM', 70, 4], ['AMD', 50, 3]] },
  ].map((s, i) => ({ ...s, i, dev: s.w - s.target, state: s.w > s.target + TOL ? 'bad' : s.w < s.target - TOL ? 'low' : 'ok' }));
  const color = (i) => `var(--c${i + 1})`;
  const chips = (s) => '<div class="chips">' + s.hold.map(([sym, n, sell]) => `<span class="hchip${sell ? ' has-t' : ''}"><b>${sym}</b><small>${n.toLocaleString('en-US')} 股</small>${sell ? `<em>賣 ${sell}</em>` : ''}</span>`).join('') + '</div>';
  const stateTxt = (s) => (s.state === 'ok' ? '剛好' : s.state === 'bad' ? '太多' : '太少');
  const diffTxt = (s) => (s.state === 'ok' ? '剛好' : (s.dev > 0 ? '多 ' : '少 ') + Math.round(Math.abs(s.dev)) + '%');
  let o1 = 'semis', o2 = 'semis', o3 = null;

  function render() {
    // 1. 色塊卡片
    document.getElementById('o1').innerHTML = SECTORS.map((s) => `<button class="tile ${s.state}${o1 === s.id ? ' on' : ''}" data-o1="${s.id}">
        <div class="nm"><i style="background:${color(s.i)}"></i>${s.name}</div>
        <div class="big">${Math.round(s.w)}%</div>
        <div class="st">${s.state === 'ok' ? '✓ 剛好' : stateTxt(s) + (s.state === 'bad' ? '・要賣' : '・要買')}</div>
        <div class="tg">目標 ${s.target}%</div></button>`).join('');
    const d1 = SECTORS.find((s) => s.id === o1);
    document.getElementById('o1d').innerHTML = d1 ? `<div class="tile-detail"><h3>${d1.name}</h3>${chips(d1)}</div>` : '';

    // 2. 只說差多少
    document.getElementById('o2').innerHTML = SECTORS.map((s) => `<div><button class="drow${o2 === s.id ? ' on' : ''}" data-o2="${s.id}"><i style="background:${color(s.i)}"></i><span class="nm">${s.name}</span><span class="dchip ${s.state}">${diffTxt(s)}</span></button>
      ${o2 === s.id ? `<div class="ddetail">${chips(s)}</div>` : ''}</div>`).join('');

    // 3. 分成兩組
    const bad = SECTORS.filter((s) => s.state !== 'ok'), ok = SECTORS.filter((s) => s.state === 'ok');
    const od = ok.find((s) => s.id === o3);
    document.getElementById('o3').innerHTML =
      (bad.length ? `<div class="grp"><h3>要調整</h3>${bad.map((s) => `<div class="todo"><div class="hd"><i style="background:${color(s.i)}"></i><b>${s.name}</b><span>${stateTxt(s)}</span></div>${chips(s)}</div>`).join('')}</div>` : '') +
      `<div class="grp"><h3>不用動</h3><div class="okchips">${ok.map((s) => `<button class="okchip" data-o3="${s.id}"><i style="background:${color(s.i)}"></i>${s.name}<span class="ck">✓</span></button>`).join('')}</div>
       ${od ? `<div class="okdetail">${chips(od)}</div>` : ''}</div>`;
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.o1) o1 = o1 === b.dataset.o1 ? null : b.dataset.o1;
    if (b.dataset.o2) o2 = o2 === b.dataset.o2 ? null : b.dataset.o2;
    if (b.dataset.o3) o3 = o3 === b.dataset.o3 ? null : b.dataset.o3;
    render();
  });
  render();
})();
</script>
</body>
</html>
