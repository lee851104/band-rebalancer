<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>區間再平衡（單頁版）</title>
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f1; --surface: #fcfcfb; --surface-2: #f0efec; --surface-3: #e8e7e2;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781; --grid: #e1e0d9;
    --border: rgba(11,11,11,.10);
    --band-fill: rgba(42,120,214,.09); --band-edge: rgba(42,120,214,.42);
    --accent: #2a78d6; --good: #0ca30c; --critical: #d03b3b; --warning: #b07600;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6;
    --shadow: 0 1px 2px rgba(11,11,11,.04), 0 10px 30px rgba(11,11,11,.06);
    --hero-glow: radial-gradient(1200px 300px at 0% 0%, rgba(42,120,214,.10), transparent 60%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --surface-3: #2e2e2b;
      --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a;
      --border: rgba(255,255,255,.10);
      --band-fill: rgba(57,135,229,.15); --band-edge: rgba(57,135,229,.55);
      --accent: #3987e5; --warning: #fab219;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c; --c7: #9085e9;
      --shadow: none;
      --hero-glow: radial-gradient(1200px 300px at 0% 0%, rgba(57,135,229,.16), transparent 60%);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #242422; --surface-3: #2e2e2b;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781; --grid: #2c2c2a;
    --border: rgba(255,255,255,.10);
    --band-fill: rgba(57,135,229,.15); --band-edge: rgba(57,135,229,.55);
    --accent: #3987e5; --warning: #fab219;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c; --c7: #9085e9;
    --shadow: none;
    --hero-glow: radial-gradient(1200px 300px at 0% 0%, rgba(57,135,229,.16), transparent 60%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--page); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; -webkit-font-smoothing: antialiased; transition: background .3s, color .3s; }
  button { font: inherit; color: inherit; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 64px; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  h1 { font-size: 18px; margin: 0; font-weight: 650; flex: 1; }
  .icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; display: grid; place-items: center; transition: background .15s, transform .15s; }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 18px; height: 18px; }
  .theme-btn .sun { display: none; }
  :root[data-theme="dark"] .theme-btn .sun { display: block; }
  :root[data-theme="dark"] .theme-btn .moon { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-btn .sun { display: block; }
    :root:not([data-theme="light"]) .theme-btn .moon { display: none; }
  }
  .menu-wrap { position: relative; }
  .menu { position: absolute; right: 0; top: 44px; z-index: 20; min-width: 220px; padding: 6px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 12px 32px rgba(0,0,0,.16); transform-origin: top right; animation: pop .14s ease-out; }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } }
  .menu[hidden] { display: none; }
  .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: none; border-radius: 8px; cursor: pointer; text-align: left; }
  .menu button:hover { background: var(--surface-2); }
  .menu svg { width: 16px; height: 16px; color: var(--muted); }
  .menu .meta { padding: 8px 10px 4px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); margin-top: 4px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }

  /* ---------- hero ---------- */
  .hero { display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: center; padding: 24px 26px; background: var(--hero-glow); border-bottom: 1px solid var(--border); }
  .donut { position: relative; width: 220px; height: 220px; }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
  .donut circle.slice { fill: none; stroke-width: 26; cursor: pointer; transition: stroke-dasharray .9s cubic-bezier(.2,.8,.2,1), stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1), stroke-width .2s, opacity .2s; }
  .donut circle.track-ring { fill: none; stroke: var(--surface-2); stroke-width: 26; }
  .donut.has-focus circle.slice { opacity: .28; }
  .donut.has-focus circle.slice.on { opacity: 1; stroke-width: 34; }
  .donut .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .donut .center small { display: block; color: var(--muted); font-size: 12px; }
  .donut .center b { display: block; font-size: 23px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .donut .center span { display: block; color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
  .verdict h2 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .verdict h2 .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .verdict h2 .ic svg { width: 20px; height: 20px; }
  .verdict.ok h2 .ic { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
  .verdict.bad h2 .ic { background: color-mix(in srgb, var(--critical) 15%, transparent); color: var(--critical); }
  .verdict p { margin: 8px 0 16px; color: var(--ink-2); max-width: 460px; }
  .todo-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--critical) 35%, transparent); background: color-mix(in srgb, var(--critical) 8%, var(--surface)); cursor: pointer; font-weight: 600; transition: transform .15s, background .15s; }
  .pill:hover { transform: translateY(-1px); background: color-mix(in srgb, var(--critical) 14%, var(--surface)); }
  .pill .sw { width: 10px; height: 10px; border-radius: 50%; }
  .pill b { font-variant-numeric: tabular-nums; }
  .pill svg { width: 14px; height: 14px; color: var(--muted); }
  .calm { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; }
  .calm svg { width: 16px; height: 16px; color: var(--good); flex: none; }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; padding: 14px 24px 6px; }
  .hint { color: var(--muted); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
  .hint svg { width: 15px; height: 15px; flex: none; }
  .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sum { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; font-size: 12.5px; font-weight: 650; background: color-mix(in srgb, var(--good) 12%, transparent); }
  .sum svg { width: 14px; height: 14px; color: var(--good); }
  .sum.bad { background: color-mix(in srgb, var(--warning) 16%, transparent); }
  .sum.bad svg { color: var(--warning); }
  .sum button { border: 0; background: var(--surface); border-radius: 999px; height: 22px; padding: 0 8px; font-size: 12px; font-weight: 650; cursor: pointer; box-shadow: 0 0 0 1px var(--border); }
  .presets { display: inline-flex; align-items: center; gap: 4px; padding: 3px; border-radius: 999px; background: var(--surface-2); font-size: 12px; color: var(--muted); }
  .presets span { padding: 0 6px 0 8px; }
  .presets button { height: 24px; padding: 0 9px; border-radius: 999px; border: 0; background: none; cursor: pointer; font-size: 12px; font-weight: 650; color: var(--ink-2); }
  .presets button:hover { background: var(--surface); color: var(--ink); }

  /* ---------- rows ---------- */
  .rows { padding: 4px 14px 6px; }
  .row { border-radius: 12px; transition: background .2s; }
  .row + .row { margin-top: 2px; }
  .row.hl, .row:hover, .row.open { background: var(--surface-2); }
  .row-main { display: grid; grid-template-columns: 124px 1fr 62px 150px; align-items: center; gap: 14px; padding: 8px 10px; cursor: pointer; border-radius: 12px; }
  .name { display: flex; align-items: center; gap: 7px; font-weight: 600; min-width: 0; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .name:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
  .name .chev { width: 14px; height: 14px; color: var(--muted); flex: none; transition: transform .25s; }
  .row.open .name .chev { transform: rotate(90deg); }
  .name .sw { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .name .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name .wm { display: none; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .track { position: relative; height: 42px; cursor: default; }
  .track::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--grid); }
  .tick { position: absolute; top: 50%; width: 1px; height: 7px; margin-top: -3.5px; background: var(--grid); }
  .band { position: absolute; top: 9px; bottom: 9px; border-radius: 7px; background: var(--band-fill); border: 1px solid var(--band-edge); transition: left .8s cubic-bezier(.2,.8,.2,1), width .8s cubic-bezier(.2,.8,.2,1); }
  .target { position: absolute; top: 5px; bottom: 5px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; transition: left .8s cubic-bezier(.2,.8,.2,1); }
  .gap { position: absolute; top: 50%; height: 0; border-top: 2px dashed var(--critical); opacity: 0; transition: left .9s cubic-bezier(.2,.8,.2,1), width .9s cubic-bezier(.2,.8,.2,1), opacity .4s .5s; pointer-events: none; }
  .gap.on { opacity: .9; }
  .gap-label { position: absolute; top: -3px; transform: translateX(-50%); font-size: 11px; font-weight: 650; color: var(--critical); white-space: nowrap; opacity: 0; transition: left .9s cubic-bezier(.2,.8,.2,1), opacity .4s .6s; font-variant-numeric: tabular-nums; pointer-events: none; }
  .gap-label.on { opacity: 1; }
  .dot { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .9s cubic-bezier(.2,.8,.2,1), transform .2s; z-index: 2; pointer-events: none; }
  .row:hover .dot, .row.hl .dot, .row.open .dot { transform: scale(1.15); border-color: var(--surface-2); }
  .dot.out::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--critical); animation: ping 1.8s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(.7); opacity: .9; } 100% { transform: scale(1.6); opacity: 0; } }
  .dragging-live .band, .dragging-live .target { transition: none; }

  /* drag handles on the main rows */
  .h { position: absolute; top: 50%; z-index: 3; cursor: ew-resize; touch-action: none; display: grid; place-items: center; }
  .h:focus-visible { outline: none; }
  .h.edge { width: 22px; height: 34px; margin: -17px 0 0 -11px; }
  .h.edge::before { content: ""; width: 6px; height: 20px; border-radius: 3px; background: var(--surface); box-shadow: 0 0 0 1.5px var(--accent); opacity: 0; transition: opacity .15s, transform .15s; }
  .h.tgt { width: 22px; height: 42px; margin: -21px 0 0 -11px; }
  .h.tgt::before { content: ""; position: absolute; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); opacity: 0; transition: opacity .15s, transform .15s; }
  .row:hover .h::before, .row.open .h::before, .h:focus-visible::before, .h.dragging::before { opacity: 1; }
  .h:hover::before, .h.dragging::before, .h:focus-visible::before { transform: scale(1.2); }
  .h.edge.dragging::before, .h.edge:focus-visible::before { background: var(--accent); }
  .h .lab { position: absolute; bottom: calc(100% - 2px); left: 50%; transform: translateX(-50%); padding: 1px 6px; border-radius: 6px; background: var(--ink); color: var(--surface); font-size: 11px; font-weight: 650; white-space: nowrap; opacity: 0; transition: opacity .12s; pointer-events: none; font-variant-numeric: tabular-nums; }
  .h.dragging .lab, .h:focus-visible .lab { opacity: 1; }
  @media (hover: none) { .h::before { opacity: .9 !important; } }
  body.dragging-x, body.dragging-x * { cursor: ew-resize !important; user-select: none; }

  .w { text-align: right; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
  .act { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .chip svg { width: 14px; height: 14px; }
  .chip.ok { background: color-mix(in srgb, var(--good) 13%, transparent); }
  .chip.ok svg { color: var(--good); }
  .chip.bad { background: color-mix(in srgb, var(--critical) 14%, transparent); }
  .chip.bad svg { color: var(--critical); }
  .act small { color: var(--muted); font-size: 12px; padding-left: 4px; }

  /* expanded sector */
  .detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .row.open .detail { grid-template-rows: 1fr; }
  .detail > div { overflow: hidden; }
  .detail-in { padding: 2px 10px 16px 150px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); }
  .stat small { display: block; color: var(--muted); font-size: 11.5px; }
  .stat b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .stat span { display: block; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .stat.do { border-color: color-mix(in srgb, var(--critical) 35%, transparent); }
  .stat.fine { border-color: color-mix(in srgb, var(--good) 35%, transparent); }
  .hold { margin-top: 12px; padding: 4px 12px 10px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); }
  .hold-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0 2px; }
  .hold-head b { font-size: 13px; }
  .hold-head input { max-width: 160px; height: 28px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-weight: 550; font-size: 12px; padding: 8px 6px 4px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 4px 6px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: 0; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  input { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; height: 30px; padding: 0 8px; width: 100%; min-width: 64px; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input.num { text-align: right; font-variant-numeric: tabular-nums; }
  input.sym { text-transform: uppercase; font-weight: 600; }
  .share { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .share i { display: block; height: 6px; border-radius: 3px; min-width: 2px; }
  .del { background: none; border: 0; color: var(--muted); cursor: pointer; width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; }
  .del:hover { background: var(--surface-2); color: var(--critical); }
  .del svg { width: 15px; height: 15px; }
  .hold-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 8px; }
  .add { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 9px; border: 1px dashed var(--border); background: none; cursor: pointer; color: var(--ink-2); font-weight: 600; }
  .add:hover { background: var(--surface-2); color: var(--ink); }
  .add svg { width: 15px; height: 15px; }
  .text-btn { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12.5px; padding: 4px 6px; border-radius: 6px; }
  .text-btn:hover { color: var(--critical); background: var(--surface-2); }
  .tip { color: var(--muted); font-size: 12px; }

  .foot-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 24px 18px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .lg-band { width: 20px; height: 11px; border-radius: 3px; background: var(--band-fill); border: 1px solid var(--band-edge); }
  .lg-target { width: 2px; height: 13px; background: var(--ink); }
  .lg-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .lg-gap { width: 18px; border-top: 2px dashed var(--critical); }
  /* ---------- quotes & ticker search ---------- */
  .quote-btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13px; transition: background .15s; }
  .quote-btn:hover { background: var(--surface-2); }
  .quote-btn svg { width: 16px; height: 16px; color: var(--accent); }
  .quote-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .quote-btn .at { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
  .symcell { min-width: 120px; }
  .cname, .pmeta { display: block; font-size: 11px; color: var(--muted); padding: 1px 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .pmeta { text-align: right; max-width: none; }
  .pmeta.live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--good); margin-right: 5px; vertical-align: 1px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
  .pmeta.loading { color: var(--accent); }
  td.flash, input.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0% { background: color-mix(in srgb, var(--accent) 30%, transparent); } 100% { background: transparent; } }
  .combo { position: fixed; z-index: 50; min-width: 300px; max-width: calc(100vw - 24px); max-height: 320px; overflow-y: auto; padding: 6px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 16px 40px rgba(0,0,0,.35); animation: pop .12s ease-out; }
  .combo[hidden] { display: none; }
  .opt { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .opt.active, .opt:hover { background: var(--surface-2); }
  .opt b { font-weight: 700; letter-spacing: .02em; }
  .opt span { color: var(--ink-2); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opt small { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .opt mark { background: none; color: var(--accent); font-weight: 750; }
  .combo .empty { padding: 10px; color: var(--muted); font-size: 12.5px; }
  .combo .foot { padding: 6px 10px 2px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--border); margin-top: 4px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 13.5px; transition: opacity .2s, transform .2s; z-index: 60; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 720px) { .quote-btn .txt { display: none; } .quote-btn { padding: 0 10px; } }

  .draft { display: inline-block; font-size: 11px; font-weight: 650; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); margin-left: 8px; vertical-align: 2px; }

  @media (max-width: 720px) {
    .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; gap: 18px; padding: 22px 16px; }
    .verdict h2 { justify-content: center; font-size: 20px; }
    .verdict p { margin-left: auto; margin-right: auto; }
    .todo-pills { justify-content: center; }
    .toolbar { padding: 12px 16px 4px; }
    .rows { padding: 4px 8px; }
    .row-main { grid-template-columns: 1fr auto; grid-template-areas: "name act" "track track"; gap: 4px 10px; padding: 10px 8px 6px; }
    .name { grid-area: name; }
    .name .wm { display: inline; }
    .track { grid-area: track; }
    .w { display: none; }
    .act { grid-area: act; align-items: flex-end; }
    .act small { padding: 0 4px 0 0; }
    .h.edge, .h.tgt { width: 30px; margin-left: -15px; }
    .detail-in { padding: 0 8px 12px; }
    .stats { grid-template-columns: 1fr; gap: 6px; }
    .stat { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0 10px; padding: 8px 12px; }
    .stat span { width: 100%; }
    /* 手機上每檔持股排成一張小卡片 */
    .hold thead { display: none; }
    .hold tr[data-hid] { display: grid; grid-template-columns: 1fr 1fr 30px; gap: 6px 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .hold tr[data-hid] td { border: 0; padding: 0; }
    .hold tr[data-hid] td:nth-child(1) { grid-column: 1 / 3; }
    .hold tr[data-hid] td:nth-child(6) { grid-column: 3; grid-row: 1; }
    .hold tr[data-hid] td:nth-child(2) { grid-column: 1; }
    .hold tr[data-hid] td:nth-child(3) { grid-column: 2 / 4; }
    .hold tr[data-hid] td:nth-child(4) { grid-column: 1; text-align: left; }
    .hold tr[data-hid] td:nth-child(5) { grid-column: 2 / 4; text-align: left; }
    .hold tr[data-hid] td:nth-child(5) .share { justify-content: flex-start; }
    .hold tr[data-hid] td:nth-child(n+2):nth-child(-n+5)::before { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; text-align: left; }
    .hold tr[data-hid] td:nth-child(2)::before { content: "股數"; }
    .hold tr[data-hid] td:nth-child(3)::before { content: "最新價格"; }
    .hold tr[data-hid] td:nth-child(4)::before { content: "市值"; }
    .hold tr[data-hid] td:nth-child(5)::before { content: "佔板塊"; }
    .symcell, .cname { max-width: none; }
    .foot-bar { padding: 6px 16px 16px; }
    .draft { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="1.6" fill="currentColor"/><circle cx="15" cy="12" r="1.6" fill="currentColor"/><circle cx="11" cy="17" r="1.6" fill="currentColor"/></svg>
    </div>
    <h1>區間再平衡<span class="draft">設計稿 · 範例資料</span></h1>
    <button class="quote-btn" id="refresh-btn" title="向 Finnhub 查詢所有持股的最新價格">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.8-4.2L4 8.5M4 4v4.5h4.5M4 13a8 8 0 0 0 14.8 4.2l1.2-1.7M20 20v-4.5h-4.5"/></svg>

      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <div class="menu-wrap">

        <button data-demo="從備份檔匯入"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>從備份匯入</button>
        <button data-demo="報價設定：貼上你的 Finnhub 免費 API 金鑰（只存在這台裝置）"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M17 6l3 3M15 8l2 2"/></svg>報價設定（Finnhub 金鑰）</button>
        <div class="meta">持股數量只存在這台裝置；查報價時只會送出股票代號・上次備份 7 天前</div>

  </header>

  <section class="card">
    <div class="hero">
      <div class="donut" id="donut">
        <svg viewBox="-120 -120 240 240" aria-hidden="true"><circle class="track-ring" r="90"/><g id="slices"></g></svg>
        <div class="center" id="center"></div>
      </div>
      <div class="verdict" id="verdict"></div>
    </div>

    <div class="toolbar">
      <div class="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V12M11 11.5v-1.5a1.5 1.5 0 0 1 3 0V12M14 11a1.5 1.5 0 0 1 3 0v1.5M17 12.5a1.5 1.5 0 0 1 3 0V16a6 6 0 0 1-6 6h-2c-2.2 0-3.5-.7-4.7-2l-3.2-3.5a1.5 1.5 0 0 1 2.2-2.1L8 16"/></svg>拖曳藍框兩端改區間、拖曳黑線改目標；點板塊名稱看持股</div>
      <div class="tools">
        <span class="sum" id="sum"></span>
        <span class="presets"><span>區間</span><button data-preset="pt3">±3 點</button><button data-preset="pt5">±5 點</button><button data-preset="rel25">±25%</button></span>

    <div class="rows" id="rows"></div>

    <div class="foot-bar">
      <button class="add" id="add-s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新增板塊</button>
      <div class="legend"><span><i class="lg-band"></i>允許區間</span><span><i class="lg-target"></i>目標</span><span><i class="lg-dot"></i>目前權重</span><span><i class="lg-gap"></i>超出的距離</span></div>
    </div>
  </section>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const state = {
    sectors: [
      { id: 'gold', name: '黃金', lo: 10, target: 15, hi: 20 },
      { id: 'uranium', name: '鈾', lo: 6, target: 10, hi: 14 },
      { id: 'semis', name: '半導體', lo: 14, target: 20, hi: 25 },
      { id: 'auto', name: '自動駕駛', lo: 8, target: 15, hi: 20 },
      { id: 'software', name: '軟體', lo: 10, target: 15, hi: 20 },
      { id: 'copper', name: '銅', lo: 6, target: 10, hi: 14 },
      { id: 'cash', name: '現金', lo: 5, target: 15, hi: 25 },
    ],
    holdings: [
      ['GLD', 'gold', 100, 245], ['IAU', 'gold', 320, 50], ['CCJ', 'uranium', 300, 72], ['URA', 'uranium', 230, 42],
      ['NVDA', 'semis', 200, 185], ['TSM', 'semis', 70, 260], ['AMD', 'semis', 50, 216], ['TSLA', 'auto', 100, 445],
      ['MSFT', 'software', 40, 480], ['CRM', 'software', 40, 270], ['FCX', 'copper', 250, 47], ['COPX', 'copper', 120, 50],
      ['USD', 'cash', 19990, 1],
    ].map(([sym, sector, shares, price], i) => ({ id: 'h' + i, sym, sector, shares, price, name: '', live: false, at: '' })),
  };
  const $ = (s) => document.querySelector(s);
  const usd = (n) => '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
  const r1 = (n) => Math.round(n * 10) / 10;
  const snap = (v) => Math.round(v * 2) / 2; // 0.5% 一格
  const fmtP = (v) => (Number.isInteger(v) ? v : v.toFixed(1)) + '%';
  const color = (i) => `var(--c${(i % 7) + 1})`;
  const val = (h) => (+h.shares || 0) * (+h.price || 0);
  const ICON = {
    ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 8v5"/><circle cx="12" cy="16.6" r=".6" fill="currentColor"/><path d="M10.3 3.9L2.6 17.5A2 2 0 0 0 4.3 20.5h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    chev: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  };
  let openId = null, focusId = null, first = true, dragging = null, scaleMax = null;

  function compute() {
    const v = Object.fromEntries(state.sectors.map((s) => [s.id, 0]));
    let total = 0;
    for (const h of state.holdings) { total += val(h); if (h.sector in v) v[h.sector] += val(h); }
    const rows = state.sectors.map((s, i) => {
      const w = total ? r1((v[s.id] / total) * 100) : 0;
      const out = w > s.hi ? 'over' : w < s.lo ? 'under' : null;
      const edge = out === 'over' ? s.hi : out === 'under' ? s.lo : null;
      return { ...s, i, value: v[s.id], w, out, edge, toEdge: out ? ((edge - w) / 100) * total : 0, toTarget: ((s.target - w) / 100) * total };
    });
    return { total, rows };
  }

  function countTo(el, to, fmt) {
    const from = +el.dataset.v || 0, t0 = performance.now(), dur = first ? 1100 : 400;
    el.dataset.v = to;
    const step = (t) => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  // ---------- 圓環 ----------
  function renderDonut(total, rows) {
    const R = 90, C = 2 * Math.PI * R, gap = 2.2;
    let acc = 0;
    const g = $('#slices');
    rows.forEach((r) => {
      let c = g.querySelector(`[data-id="${r.id}"]`);
      if (!c) { c = document.createElementNS('http://www.w3.org/2000/svg', 'circle'); c.setAttribute('class', 'slice'); c.setAttribute('r', R); c.dataset.id = r.id; c.style.strokeDasharray = `0 ${C}`; g.appendChild(c); }
      const f = total ? r.value / total : 0;
      c.style.stroke = color(r.i);
      const len = Math.max(f * C - gap, 0), off = -acc * C;
      requestAnimationFrame(() => { c.style.strokeDasharray = `${len} ${C}`; c.style.strokeDashoffset = off; });
      acc += f;
      c.classList.toggle('on', r.id === focusId);
    });
    [...g.children].forEach((c) => { if (!rows.some((r) => r.id === c.dataset.id)) c.remove(); });
    $('#donut').classList.toggle('has-focus', !!focusId);
    const center = $('#center');
    const fr = rows.find((r) => r.id === focusId);
    if (fr) {
      center.innerHTML = `<div><small>${fr.name}</small><b>${fr.w.toFixed(1)}%</b><span>${usd(fr.value)}・目標 ${fmtP(fr.target)}</span></div>`;
    } else {
      if (!center.querySelector('#tv')) center.innerHTML = `<div><small>總市值</small><b id="tv" data-v="0">$0</b><span></span></div>`;
      center.querySelector('span').textContent = `${rows.length} 個板塊・${state.holdings.length} 檔持股`;
      countTo(center.querySelector('#tv'), total, usd);
    }
  }

  // ---------- 結論 ----------
  function renderVerdict(rows) {
    const outs = rows.filter((r) => r.out);
    const v = $('#verdict');
    v.className = 'verdict ' + (outs.length ? 'bad' : 'ok');
    v.innerHTML = outs.length
      ? `<h2><span class="ic">${ICON.warn}</span>${outs.length} 個板塊超出區間</h2>
         <p>其他 ${rows.length - outs.length} 個板塊都在允許範圍內，不用動。下面是最少要調整的金額：</p>
         <div class="todo-pills">${outs.map((r) => `<button class="pill" data-open="${r.id}"><i class="sw" style="background:${color(r.i)}"></i>${r.name}<b>${r.toEdge < 0 ? '賣出' : '買入'} ${usd(r.toEdge)}</b>${ICON.chev}</button>`).join('')}</div>`
      : `<h2><span class="ic">${ICON.ok}</span>全部在區間內</h2>
         <p>每個板塊都在你設定的允許範圍內，這次一股都不用動。</p>
         <span class="calm">${ICON.ok}下次檢查時再看看就好</span>`;
  }

  function renderSum() {
    const sum = r1(state.sectors.reduce((a, s) => a + s.target, 0));
    const el = $('#sum');
    el.className = 'sum' + (sum === 100 ? '' : ' bad');
    el.innerHTML = sum === 100 ? `${ICON.ok}目標合計 100%` : `${ICON.warn}目標合計 ${sum}%<button data-fix-sum>補成 100%</button>`;
  }

  // ---------- 主圖：每個板塊一列，可直接拖曳編輯 ----------
  function buildRow(r) {
    const el = document.createElement('div');
    el.className = 'row'; el.dataset.id = r.id;
    el.innerHTML = `<div class="row-main">
        <button class="name" aria-expanded="false">${ICON.chev.replace('<svg', '<svg class="chev"')}<i class="sw"></i><span class="t"></span><span class="wm"></span></button>
        <div class="track">
          <span class="band"></span><span class="target"></span><span class="gap"></span><span class="gap-label"></span><span class="dot"></span>
          <span class="h edge" data-edge="lo" tabindex="0" role="slider"><span class="lab"></span></span>
          <span class="h tgt" data-edge="target" tabindex="0" role="slider"><span class="lab"></span></span>
          <span class="h edge" data-edge="hi" tabindex="0" role="slider"><span class="lab"></span></span>
        </div>
        <span class="w"></span><span class="act"></span>
      </div>
      <div class="detail"><div><div class="detail-in"><div class="stats"></div><div class="hold"></div></div></div></div>`;
    return el;
  }

  function renderRows(total, rows) {
    if (!dragging || scaleMax === null) scaleMax = Math.max(30, Math.ceil((Math.max(...rows.map((r) => Math.max(r.hi, r.w, r.target))) + 4) / 5) * 5);
    const max = scaleMax;
    const x = (v) => (Math.max(0, Math.min(v, max)) / max) * 100;
    const box = $('#rows');
    box.classList.toggle('dragging-live', !!dragging);
    rows.forEach((r) => {
      let el = box.querySelector(`.row[data-id="${r.id}"]`);
      const fresh = !el;
      if (fresh) {
        el = buildRow(r);
        el.querySelector('.dot').style.left = x(r.target) + '%';
        el.querySelector('.band').style.left = x(r.target) + '%';
        el.querySelector('.band').style.width = '0%';
        el.querySelector('.target').style.left = x(r.target) + '%';
        renderHoldings(el, r);
      }
      box.appendChild(el);
      const tr = el.querySelector('.track');
      if (tr.dataset.max != max) {
        tr.querySelectorAll('.tick').forEach((t) => t.remove());
        for (let t = 0; t <= max; t += 5) { const k = document.createElement('i'); k.className = 'tick'; k.style.left = x(t) + '%'; tr.prepend(k); }
        tr.dataset.max = max;
      }
      el.querySelector('.sw').style.background = color(r.i);
      el.querySelector('.t').textContent = r.name;
      el.querySelector('.wm').textContent = r.w.toFixed(1) + '%';
      el.querySelector('.w').textContent = r.w.toFixed(1) + '%';
      const dot = el.querySelector('.dot');
      dot.style.background = color(r.i);
      dot.classList.toggle('out', !!r.out);
      const gapEl = el.querySelector('.gap'), gl = el.querySelector('.gap-label');
      const hs = { lo: el.querySelector('[data-edge="lo"]'), target: el.querySelector('[data-edge="target"]'), hi: el.querySelector('[data-edge="hi"]') };
      const apply = () => {
        el.querySelector('.band').style.left = x(r.lo) + '%';
        el.querySelector('.band').style.width = (x(r.hi) - x(r.lo)) + '%';
        el.querySelector('.target').style.left = x(r.target) + '%';
        dot.style.left = x(r.w) + '%';
        for (const k in hs) {
          hs[k].style.left = x(r[k]) + '%';
          hs[k].querySelector('.lab').textContent = (k === 'target' ? '目標 ' : k === 'lo' ? '下限 ' : '上限 ') + fmtP(r[k]);
          hs[k].setAttribute('aria-valuenow', r[k]);
          hs[k].setAttribute('aria-label', `${r.name} ${k === 'target' ? '目標' : k === 'lo' ? '下限' : '上限'}`);
        }
        if (r.out) {
          const a = Math.min(r.edge, r.w), b = Math.max(r.edge, r.w);
          gapEl.style.left = x(a) + '%'; gapEl.style.width = (x(b) - x(a)) + '%';
          gl.style.left = x((a + b) / 2) + '%';
          gl.textContent = (r.out === 'over' ? '+' : '−') + Math.abs(r1(r.w - r.edge)).toFixed(1) + ' 點';
        }
        gapEl.classList.toggle('on', !!r.out); gl.classList.toggle('on', !!r.out);
      };
      if (fresh && first) requestAnimationFrame(() => requestAnimationFrame(apply)); else apply();
      el.querySelector('.act').innerHTML = r.out
        ? `<span class="chip bad">${ICON.warn}${r.toEdge < 0 ? '賣出' : '買入'} ${usd(r.toEdge)}</span><small>${r.out === 'over' ? '超出上限' : '低於下限'} ${fmtP(r.edge)}</small>`
        : `<span class="chip ok">${ICON.ok}區間內</span>`;
      const room = `離上限還有 ${(r.hi - r.w).toFixed(1)} 點（約 ${usd(((r.hi - r.w) / 100) * total)}）`;
      el.querySelector('.stats').innerHTML = `
        <div class="stat"><small>目前</small><b>${r.w.toFixed(1)}%</b><span>${usd(r.value)}</span></div>
        <div class="stat"><small>目標 ${fmtP(r.target)}</small><b>${usd((r.target / 100) * total)}</b><span>${Math.round(r.toTarget) === 0 ? '已在目標' : (r.toTarget < 0 ? '賣出 ' : '買入 ') + usd(r.toTarget) + ' 可回到目標'}</span></div>
        <div class="stat ${r.out ? 'do' : 'fine'}"><small>允許區間 ${fmtP(r.lo)}–${fmtP(r.hi)}</small><b>${usd((r.lo / 100) * total)}–${usd((r.hi / 100) * total).slice(1)}</b><span>${r.out ? (r.toEdge < 0 ? '賣出 ' : '買入 ') + usd(r.toEdge) + ' 回到區間' : room}</span></div>`;
      updateHoldingCells(el, r);
      el.classList.toggle('open', openId === r.id);
      el.classList.toggle('hl', focusId === r.id);
      el.querySelector('.name').setAttribute('aria-expanded', String(openId === r.id));
    });
    [...box.children].forEach((el) => { if (!rows.some((r) => r.id === el.dataset.id)) el.remove(); });
  }

  // 展開後的持股表（打字時只更新數字，不重畫輸入框）
  function renderHoldings(el, r) {
    const list = state.holdings.filter((h) => h.sector === r.id);
    el.querySelector('.hold').innerHTML = `
      <div class="hold-head"><b>持股明細</b><input data-sector-name="${r.id}" value="${r.name}" aria-label="板塊名稱" title="板塊名稱"></div>
      <table>
        <thead><tr><th>代號</th><th class="num">股數</th><th class="num">最新價格</th><th class="num">市值</th><th class="num">佔板塊</th><th></th></tr></thead>
        <tbody>${list.map((h) => `<tr data-hid="${h.id}">
          <td class="symcell"><input class="sym" data-hid="${h.id}" data-k="sym" value="${h.sym}" placeholder="輸入代號或公司名" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false"><small class="cname" data-cell="cn"></small></td>
          <td><input class="num" type="number" data-hid="${h.id}" data-k="shares" value="${h.shares}"></td>
          <td><input class="num" type="number" data-hid="${h.id}" data-k="price" value="${h.price}"><small class="pmeta" data-cell="pm"></small></td>
          <td class="num" data-cell="v"></td>
          <td class="num"><span class="share"><i style="background:${color(r.i)}"></i><span data-cell="p"></span></span></td>
          <td><button class="del" data-del-h="${h.id}" aria-label="刪除 ${h.sym}">${ICON.trash}</button></td>
        </tr>`).join('') || '<tr><td colspan="6" class="tip" style="padding:12px 6px">這個板塊還沒有持股</td></tr>'}</tbody>
      </table>
      <div class="hold-foot"><button class="add" data-add-h="${r.id}">${ICON.plus}新增持股</button><span class="tip">現金：股數填金額、價格填 1</span><button class="text-btn" data-del-s="${r.id}">刪除這個板塊</button></div>`;
  }
  function updateHoldingCells(el, r) {
    el.querySelectorAll('tr[data-hid]').forEach((tr) => {
      const h = state.holdings.find((x) => x.id === tr.dataset.hid); if (!h) return;
      const v = val(h), p = r.value ? (v / r.value) * 100 : 0;
      tr.querySelector('[data-cell="v"]').textContent = usd(v);
      tr.querySelector('[data-cell="p"]').textContent = p.toFixed(0) + '%';
      tr.querySelector('.share i').style.width = Math.max(2, p * 0.5) + 'px';
      const info = lookup(h.sym);
      tr.querySelector('[data-cell="cn"]').textContent = isCash(h.sym) ? '現金（美元）' : info ? info.name : h.sym ? '找不到這個代號，價格請手動填' : '';
      const pm = tr.querySelector('[data-cell="pm"]');
      if (pm.classList.contains('loading')) return;
      pm.className = 'pmeta' + (h.live ? ' live' : '');
      pm.textContent = isCash(h.sym) ? '固定 1' : h.live ? '即時・' + h.at : h.sym ? '手動填寫' : '';
    });
  }

  // ---------- 美股代號模糊搜尋（設計稿用內建的小清單示範，正式版內建完整美股清單） ----------
  const SYMBOLS = [
    ['AAPL', 'Apple Inc.', 228.5], ['MSFT', 'Microsoft Corp.', 480.2], ['NVDA', 'NVIDIA Corp.', 185.3], ['AMD', 'Advanced Micro Devices', 216.1],
    ['TSM', 'Taiwan Semiconductor (ADR)', 260.4], ['AVGO', 'Broadcom Inc.', 342.0], ['INTC', 'Intel Corp.', 24.6], ['QCOM', 'Qualcomm Inc.', 168.9],
    ['MU', 'Micron Technology', 112.7], ['ASML', 'ASML Holding (ADR)', 812.5], ['ARM', 'Arm Holdings (ADR)', 151.2], ['SMH', 'VanEck Semiconductor ETF', 268.3],
    ['TSLA', 'Tesla Inc.', 445.0], ['GOOGL', 'Alphabet Inc. Class A', 196.4], ['AMZN', 'Amazon.com Inc.', 226.9], ['META', 'Meta Platforms', 712.3],
    ['CRM', 'Salesforce Inc.', 270.1], ['ORCL', 'Oracle Corp.', 238.6], ['ADBE', 'Adobe Inc.', 402.8], ['NOW', 'ServiceNow Inc.', 980.4],
    ['PLTR', 'Palantir Technologies', 168.2], ['SNOW', 'Snowflake Inc.', 221.5], ['IGV', 'iShares Expanded Tech-Software ETF', 108.9],
    ['GLD', 'SPDR Gold Shares', 245.0], ['IAU', 'iShares Gold Trust', 50.1], ['GDX', 'VanEck Gold Miners ETF', 62.3], ['NEM', 'Newmont Corp.', 78.4],
    ['CCJ', 'Cameco Corp.', 72.0], ['URA', 'Global X Uranium ETF', 42.1], ['URNM', 'Sprott Uranium Miners ETF', 55.6], ['UEC', 'Uranium Energy Corp.', 11.9], ['NXE', 'NexGen Energy', 8.7],
    ['FCX', 'Freeport-McMoRan', 47.0], ['COPX', 'Global X Copper Miners ETF', 50.0], ['SCCO', 'Southern Copper Corp.', 118.3], ['CPER', 'US Copper Index Fund', 31.4],
    ['SPY', 'SPDR S&P 500 ETF', 662.1], ['QQQ', 'Invesco QQQ Trust', 598.7], ['VOO', 'Vanguard S&P 500 ETF', 608.5], ['VTI', 'Vanguard Total Stock Market ETF', 325.2],
    ['SGOV', 'iShares 0-3 Month Treasury Bond ETF', 100.5], ['BIL', 'SPDR 1-3 Month T-Bill ETF', 91.6], ['BRK.B', 'Berkshire Hathaway Class B', 498.3],
    ['JPM', 'JPMorgan Chase & Co.', 301.2], ['V', 'Visa Inc.', 352.4], ['COST', 'Costco Wholesale', 948.1], ['NFLX', 'Netflix Inc.', 1180.5],
  ].map(([sym, name, price]) => ({ sym, name, price }));
  const isCash = (s) => s === 'USD' || s === 'CASH';
  const lookup = (s) => SYMBOLS.find((x) => x.sym === s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // 分數：代號完全相同 > 代號開頭相同 > 公司名的單字開頭 > 代號/公司名包含 > 依序出現的字母（打錯也找得到）
  function fuzzy(q) {
    q = q.trim();
    if (!q) return SYMBOLS.slice(0, 8).map((it) => ({ it, s: 0 }));
    const Q = q.toUpperCase(), ql = q.toLowerCase();
    const out = [];
    for (const it of SYMBOLS) {
      const nl = it.name.toLowerCase();
      let s = 0;
      if (it.sym === Q) s = 1000;
      else if (it.sym.startsWith(Q)) s = 800 - it.sym.length;
      else if (nl.split(/[\s.&()-]+/).some((w) => w.startsWith(ql))) s = 600;
      else if (it.sym.includes(Q)) s = 500;
      else if (nl.includes(ql)) s = 400;
      else {
        let i = 0, gaps = 0, last = -1; const hay = (it.sym + ' ' + nl).toLowerCase();
        for (let j = 0; j < hay.length && i < ql.length; j++) if (hay[j] === ql[i]) { if (last >= 0) gaps += j - last - 1; last = j; i++; }
        if (i === ql.length && ql.length >= 2) s = Math.max(1, 200 - gaps * 4);
      }
      if (s) out.push({ it, s });
    }
    return out.sort((a, b) => b.s - a.s).slice(0, 8);
  }
  function mark(text, q) {
    if (!q) return esc(text);
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
  }

  const combo = document.createElement('div');
  combo.className = 'combo'; combo.id = 'combo'; combo.setAttribute('role', 'listbox'); combo.hidden = true;
  document.body.appendChild(combo);
  let comboFor = null, comboItems = [], comboActive = 0;
  function openCombo(input) {
    comboFor = input;
    const q = input.value;
    comboItems = fuzzy(q).map((x) => x.it);
    comboActive = 0;
    combo.innerHTML = (comboItems.length
      ? comboItems.map((it, i) => `<div class="opt${i === 0 ? ' active' : ''}" role="option" data-i="${i}"><b>${mark(it.sym, q)}</b><span>${mark(it.name, q)}</span><small>$${it.price.toFixed(2)}</small></div>`).join('')
      : `<div class="empty">找不到「${esc(q)}」。按 Enter 直接使用這個代號，價格請手動填。</div>`) +
      `<div class="foot">${q ? '↑↓ 選擇・Enter 確定・Esc 關閉' : '熱門代號・輸入代號或公司名搜尋'}</div>`;
    const r = input.getBoundingClientRect();
    combo.style.left = Math.min(r.left, innerWidth - 312) + 'px';
    combo.style.top = (r.bottom + 6) + 'px';
    combo.hidden = false;
    input.setAttribute('aria-expanded', 'true');
  }
  function closeCombo() { combo.hidden = true; if (comboFor) comboFor.setAttribute('aria-expanded', 'false'); comboFor = null; }
  function moveActive(d) {
    if (!comboItems.length) return;
    comboActive = (comboActive + d + comboItems.length) % comboItems.length;
    combo.querySelectorAll('.opt').forEach((o, i) => o.classList.toggle('active', i === comboActive));
    combo.querySelector('.opt.active').scrollIntoView({ block: 'nearest' });
  }
  function choose(input, it) {
    const h = state.holdings.find((x) => x.id === input.dataset.hid);
    h.sym = it ? it.sym : input.value.trim().toUpperCase();
    input.value = h.sym;
    closeCombo();
    if (it) fetchQuote(h); else { h.live = false; render(); }
    const shares = document.querySelector(`[data-hid="${h.id}"][data-k="shares"]`);
    if (shares && !h.shares) shares.focus();
  }

  // ---------- 報價（設計稿模擬 Finnhub 的回應時間與價格） ----------
  const now = () => new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
  function fetchQuote(h) {
    const info = lookup(h.sym);
    const pm = document.querySelector(`tr[data-hid="${h.id}"] [data-cell="pm"]`);
    if (!info) return Promise.resolve();
    if (pm) { pm.className = 'pmeta loading'; pm.textContent = '查詢報價中…'; }
    return new Promise((res) => setTimeout(() => {
      info.price = Math.round(info.price * (1 + (Math.random() - 0.5) * 0.03) * 100) / 100;
      h.price = info.price; h.live = true; h.at = now(); h.name = info.name;
      if (pm) pm.className = 'pmeta';
      const inp = document.querySelector(`[data-hid="${h.id}"][data-k="price"]`);
      if (inp) { inp.value = h.price; inp.classList.remove('flash'); void inp.offsetWidth; inp.classList.add('flash'); }
      $('#quote-at').textContent = h.at;
      render(); res();
    }, 350 + Math.random() * 400));
  }
  async function refreshAll() {
    const btn = $('#refresh-btn');
    if (btn.classList.contains('spin')) return;
    btn.classList.add('spin');
    const list = state.holdings.filter((h) => lookup(h.sym));
    await Promise.all(list.map(fetchQuote));
    btn.classList.remove('spin');
    toast(`已更新 ${list.length} 檔報價`);
  }
  let toastT;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

  // ---------- 拖曳規則 ----------
  function keepBand(s) { // 目標跑出區間時，整段區間跟著平移
    if (s.target < s.lo) { const d = s.target - s.lo; s.lo += d; s.hi += d; }
    if (s.target > s.hi) { const d = s.target - s.hi; s.lo += d; s.hi += d; }
    s.lo = snap(Math.max(0, Math.min(s.lo, s.target))); s.hi = snap(Math.min(100, Math.max(s.hi, s.target)));
  }
  function setValue(s, edge, v) {
    v = snap(v);
    if (edge === 'lo') s.lo = Math.max(0, Math.min(v, s.target));
    else if (edge === 'hi') s.hi = Math.min(100, Math.max(v, s.target));
    else { s.target = Math.max(0, Math.min(100, v)); keepBand(s); }
  }
  function fixSum() { // 依比例縮放所有目標，讓合計回到 100%
    const sum = state.sectors.reduce((a, s) => a + s.target, 0);
    if (!sum) return;
    state.sectors.forEach((s) => { s.target = snap((s.target / sum) * 100); });
    const diff = r1(100 - state.sectors.reduce((a, s) => a + s.target, 0));
    const big = state.sectors.reduce((m, s) => (s.target > m.target ? s : m));
    big.target = r1(big.target + diff);
    state.sectors.forEach(keepBand);
  }
  function applyPreset(kind) {
    state.sectors.forEach((s) => {
      const d = kind === 'pt3' ? 3 : kind === 'pt5' ? 5 : s.target * 0.25;
      s.lo = snap(Math.max(0, s.target - d)); s.hi = snap(Math.min(100, s.target + d));
    });
  }

  document.addEventListener('pointerdown', (e) => {
    const h = e.target.closest('.h');
    if (!h) return;
    e.preventDefault(); e.stopPropagation();
    dragging = { el: h, id: h.closest('.row').dataset.id, rect: h.closest('.track').getBoundingClientRect(), max: scaleMax };
    try { h.setPointerCapture(e.pointerId); } catch (_) {}
    h.classList.add('dragging'); document.body.classList.add('dragging-x');
    h.focus({ preventScroll: true });
  });
  document.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const s = state.sectors.find((x) => x.id === dragging.id);
    setValue(s, dragging.el.dataset.edge, ((e.clientX - dragging.rect.left) / dragging.rect.width) * dragging.max);
    render();
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging.el.classList.remove('dragging'); document.body.classList.remove('dragging-x');
    dragging = null; dragEnded = performance.now(); render();
  };
  let dragEnded = 0;
  document.addEventListener('pointerup', endDrag);
  document.addEventListener('pointercancel', endDrag);
  document.addEventListener('keydown', (e) => {
    const h = e.target.closest && e.target.closest('.h');
    if (!h || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    e.preventDefault();
    const s = state.sectors.find((x) => x.id === h.closest('.row').dataset.id);
    setValue(s, h.dataset.edge, s[h.dataset.edge] + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 5 : 0.5));
    render();
  });

  // ---------- 總更新 ----------
  function render() {
    const { total, rows } = compute();
    renderDonut(total, rows);
    renderVerdict(rows);
    renderSum();
    renderRows(total, rows);
    first = false;
  }
  function rebuildRow(id) { const el = document.querySelector(`.row[data-id="${id}"]`); const { rows } = compute(); const r = rows.find((x) => x.id === id); if (el && r) renderHoldings(el, r); render(); }
  function toggle(id, scroll) {
    openId = openId === id && !scroll ? null : id;
    render();
    if (scroll) document.querySelector(`.row[data-id="${id}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // ---------- 一般互動 ----------
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.dataset.hid) {
      const h = state.holdings.find((x) => x.id === t.dataset.hid);
      if (t.dataset.k === 'sym') { openCombo(t); return; } // 選定後才寫入代號
      h[t.dataset.k] = t.value;
      if (t.dataset.k === 'price') h.live = false; // 手動改價格
      render();
    } else if (t.dataset.sectorName) {
      state.sectors.find((s) => s.id === t.dataset.sectorName).name = t.value;
      render();
    }
  });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    const menu = $('#menu');
    if (!b || !b.closest('.menu-wrap')) menu.hidden = true;
    // 點列的空白處（不是軌道）也能展開
    const main = e.target.closest('.row-main');
    if (main && !e.target.closest('.track') && performance.now() - dragEnded > 250) { toggle(main.closest('.row').dataset.id); return; }
    if (!b) return;
    if (b.id === 'menu-btn') { menu.hidden = !menu.hidden; b.setAttribute('aria-expanded', String(!menu.hidden)); return; }
    if (b.dataset.demo) { alert(b.dataset.demo + '（設計稿僅示意）'); menu.hidden = true; }
    if (b.id === 'theme-btn') { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; }
    if (b.dataset.open) toggle(b.dataset.open, true);
    if (b.dataset.preset) { applyPreset(b.dataset.preset); render(); }
    if (b.hasAttribute('data-fix-sum')) { fixSum(); render(); }
    if (b.dataset.addH) {
      const h = { id: 'h' + Date.now(), sym: '', sector: b.dataset.addH, shares: '', price: '' };
      state.holdings.push(h); rebuildRow(b.dataset.addH);
      document.querySelector(`[data-hid="${h.id}"][data-k="sym"]`).focus();
    }
    if (b.dataset.delH) {
      const h = state.holdings.find((x) => x.id === b.dataset.delH);
      state.holdings = state.holdings.filter((x) => x !== h); rebuildRow(h.sector);
    }
    if (b.dataset.delS) {
      const i = state.sectors.findIndex((s) => s.id === b.dataset.delS), gone = state.sectors[i];
      const n = state.holdings.filter((h) => h.sector === gone.id).length;
      if (!confirm(`刪除「${gone.name}」？${n ? `其中的 ${n} 檔持股也會一起刪除。` : ''}`)) return;
      state.sectors.splice(i, 1);
      state.holdings = state.holdings.filter((h) => h.sector !== gone.id);
      if (state.sectors.length) { const nb = state.sectors[Math.max(0, i - 1)]; nb.target = r1(nb.target + gone.target); keepBand(nb); } // 目標還給相鄰板塊
      openId = null; render();
    }
  });
  // 代號搜尋選單
  document.addEventListener('focusin', (e) => { if (e.target.matches('input.sym')) { e.target.select(); openCombo(e.target); } });
  document.addEventListener('focusout', (e) => {
    if (!e.target.matches('input.sym')) return;
    const input = e.target;
    setTimeout(() => {
      if (comboFor !== input) return;
      const h = state.holdings.find((x) => x.id === input.dataset.hid);
      const typed = input.value.trim().toUpperCase();
      if (typed && typed !== h.sym) choose(input, lookup(typed) || null); else { input.value = h.sym; closeCombo(); }
    }, 150);
  });
  document.addEventListener('keydown', (e) => {
    if (!e.target.matches || !e.target.matches('input.sym') || combo.hidden) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); moveActive(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(e.target, comboItems[comboActive] || null); }
    else if (e.key === 'Escape') { const h = state.holdings.find((x) => x.id === e.target.dataset.hid); e.target.value = h.sym; closeCombo(); }
  });
  combo.addEventListener('mousedown', (e) => { const o = e.target.closest('.opt'); if (!o || !comboFor) return; e.preventDefault(); choose(comboFor, comboItems[+o.dataset.i]); });
  window.addEventListener('scroll', () => { if (comboFor) openCombo(comboFor); }, { passive: true });
  $('#refresh-btn').addEventListener('click', refreshAll);

  $('#add-s').addEventListener('click', () => {
    const big = state.sectors.reduce((m, s) => (s.target > m.target ? s : m), state.sectors[0]);
    const give = Math.min(5, big.target); big.target = r1(big.target - give); keepBand(big);
    const s = { id: 's' + Date.now(), name: '新板塊', lo: Math.max(0, give - 3), target: give, hi: give + 3 };
    state.sectors.push(s); openId = s.id; render();
    const inp = document.querySelector(`[data-sector-name="${s.id}"]`); setTimeout(() => { inp.focus(); inp.select(); }, 320);
  });
  // 圓環與板塊列連動
  const setFocus = (id) => { if (focusId === id) return; focusId = id; const { total, rows } = compute(); renderDonut(total, rows); document.querySelectorAll('.row').forEach((el) => el.classList.toggle('hl', el.dataset.id === focusId)); };
  $('#slices').addEventListener('pointerover', (e) => { const c = e.target.closest('.slice'); if (c) setFocus(c.dataset.id); });
  $('#slices').addEventListener('pointerout', () => setFocus(null));
  $('#slices').addEventListener('click', (e) => { const c = e.target.closest('.slice'); if (c) toggle(c.dataset.id, true); });
  $('#rows').addEventListener('pointerover', (e) => { const r = e.target.closest('.row'); if (r && !dragging) setFocus(r.dataset.id); });
  $('#rows').addEventListener('pointerleave', () => { if (!dragging) setFocus(null); });

  // 範例資料一開始就是剛查好的報價
  const t0 = now();
  state.holdings.forEach((h) => { const info = lookup(h.sym); if (info) { h.live = true; h.at = t0; h.name = info.name; } });
  $('#quote-at').textContent = t0;
  render();
})();
</script>
