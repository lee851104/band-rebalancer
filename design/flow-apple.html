<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的倉位</title>
<style>
  /* 風格：依 getdesign.md 的 Apple 設計分析（深色區塊版）
     單一強調色藍、無漸層、無卡片陰影、膠囊按鈕、全寬區塊交替、標題 600 字重與負字距、內文 17px */
  :root {
    color-scheme: dark;
    --black: #000000;
    --tile: #1d1d1f;
    --tile-2: #272729;
    --card: #2a2a2c;
    --ink: #f5f5f7;
    --ink-2: #cccccc;
    --ink-3: #86868b;
    --hair: rgba(255,255,255,.08);
    --blue: #0071e3;          /* 主要按鈕 */
    --link: #2997ff;          /* 深色區塊上的連結 */
    --red: #ff453a;           /* 系統紅：超出範圍 */
    --green: #30d158;         /* 系統綠：在範圍內 */
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9; --cash: #636366;
    --display: "SF Pro Display", system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --text: "SF Pro Text", system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--black); color: var(--ink); font: 400 17px/1.47 var(--text); letter-spacing: -0.374px; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; letter-spacing: inherit; }
  a { color: var(--link); text-decoration: none; }

  /* 毛玻璃導覽列 */
  .subnav { position: sticky; top: 0; z-index: 20; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 max(22px, calc((100vw - 980px) / 2)); background: rgba(22,22,23,.8); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--hair); }
  .subnav b { font: 600 21px/1.19 var(--display); letter-spacing: .231px; }
  .subnav .r { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--ink-3); letter-spacing: -0.12px; }

  /* 膠囊按鈕 */
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 9999px; padding: 11px 22px; font-size: 17px; border: 1px solid transparent; cursor: pointer; transition: transform .15s ease, background .2s ease; white-space: nowrap; }
  .pill:active { transform: scale(.95); }
  .pill:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .pill.primary { background: var(--blue); color: #fff; }
  .pill.ghost { background: transparent; color: var(--link); border-color: var(--link); }
  .pill.small { padding: 6px 14px; font-size: 14px; letter-spacing: -0.224px; }
  .pill.done { background: var(--green); color: #00230b; }
  .pill:disabled { opacity: .4; cursor: default; transform: none; }

  /* 全寬區塊 */
  .tile { padding: 80px 22px; text-align: center; }
  .tile.black { background: var(--black); }
  .tile.dark { background: var(--tile); }
  .inner { max-width: 980px; margin: 0 auto; }
  .eyebrow { font: 600 21px/1.19 var(--display); letter-spacing: .231px; color: var(--ink-3); margin: 0 0 8px; }
  .hero-h { font: 600 56px/1.07 var(--display); letter-spacing: -0.28px; margin: 0; }
  .hero-h .bad { color: var(--red); }
  .hero-h .ok { color: var(--green); }
  .lead { font: 400 28px/1.14 var(--display); letter-spacing: .196px; color: var(--ink-2); margin: 14px auto 0; max-width: 820px; text-wrap: balance; }
  .hero-h, .sec-h, .sec-sub { text-wrap: balance; }
  .ctas { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin-top: 28px; }
  .stats { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; margin-top: 48px; }
  .stat small { display: block; font-size: 14px; color: var(--ink-3); letter-spacing: -0.224px; }
  .stat b { display: block; font: 600 34px/1.2 var(--display); letter-spacing: -0.374px; font-variant-numeric: tabular-nums; }
  .stat b.bad { color: var(--red); }
  .stat b.ok { color: var(--green); }
  .sec-h { font: 600 40px/1.1 var(--display); margin: 0; }
  .sec-sub { font: 400 21px/1.38 var(--display); color: var(--ink-3); margin: 10px 0 36px; letter-spacing: .231px; }

  /* 流向圖 */
  #flow { width: 100%; height: auto; display: block; overflow: visible; }
  #flow text { font-family: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -0.224px; }
  .seg-name { fill: #fff; font-weight: 600; font-size: 15px; }
  .seg-pct { fill: rgba(255,255,255,.82); font-size: 13px; }
  .row-lbl { fill: var(--ink-3); font-size: 14px; font-weight: 600; }
  .fx { cursor: pointer; transition: opacity .25s ease; }
  .dimmed .fx:not(.on) { opacity: .25; }
  .flowing { stroke-dasharray: 3 12; animation: run 1.1s linear infinite; }
  @keyframes run { to { stroke-dashoffset: -30; } }
  .pulse { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .6; } }
  .fine { font-size: 12px; color: var(--ink-3); letter-spacing: -0.12px; margin-top: 18px; }

  /* 板塊卡片 */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; text-align: left; }
  .card { background: var(--card); border: 1px solid var(--hair); border-radius: 18px; padding: 24px; cursor: pointer; transition: border-color .2s ease; }
  .card:hover { border-color: rgba(255,255,255,.2); }
  .card.on { border-color: rgba(255,255,255,.32); }
  .card.out { border-color: rgba(255,69,58,.6); }
  .card.fixed { border-color: rgba(48,209,88,.6); }
  .card .hd { display: flex; align-items: center; gap: 10px; }
  .card .hd i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .card .nm { font: 600 21px/1.19 var(--display); letter-spacing: .231px; flex: 1; }
  .card .st { font-size: 14px; font-weight: 600; letter-spacing: -0.224px; white-space: nowrap; }
  .card .st.ok { color: var(--green); }
  .card .st.sell { color: var(--red); }
  .card .st.buy { color: var(--link); }
  .card .big { font: 600 40px/1.1 var(--display); margin: 14px 0 2px; font-variant-numeric: tabular-nums; }
  .card .cap { font-size: 14px; color: var(--ink-3); letter-spacing: -0.224px; font-variant-numeric: tabular-nums; }
  .mini { position: relative; height: 24px; margin: 18px 0 4px; }
  .mini .tr { position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: rgba(255,255,255,.1); border-radius: 1px; }
  .mini .band { position: absolute; top: 5px; height: 14px; border-radius: 7px; background: rgba(48,209,88,.18); }
  .mini .tg { position: absolute; top: 2px; width: 2px; height: 20px; margin-left: -1px; background: var(--ink); border-radius: 1px; }
  .mini .dot { position: absolute; top: 5px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px solid var(--card); transition: left .8s cubic-bezier(.2,.8,.2,1); }
  .mini .ghost { position: absolute; top: 5px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; border: 2px dashed var(--ink-3); }
  .scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); letter-spacing: -0.12px; }
  .how { display: none; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hair); }
  .card.on .how { display: block; }
  .how .t { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: baseline; padding: 8px 0; font-variant-numeric: tabular-nums; }
  .how .t + .t { border-top: 1px solid var(--hair); }
  .how .t b { font-weight: 600; }
  .how .t .sell { color: var(--red); font-weight: 600; }
  .how .t .buy { color: var(--link); font-weight: 600; }
  .how .t small { color: var(--ink-3); font-size: 14px; }
  .how p { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); letter-spacing: -0.224px; }

  footer { background: var(--tile); color: var(--ink-3); font-size: 12px; letter-spacing: -0.12px; padding: 32px 22px 48px; }
  footer .inner { border-top: 1px solid var(--hair); padding-top: 18px; text-align: left; }

  @media (max-width: 1068px) { .cards { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 734px) {
    .tile { padding: 48px 18px; }
    .hero-h { font-size: 40px; line-height: 1.1; }
    .lead { font-size: 21px; line-height: 1.38; }
    .sec-h { font-size: 32px; }
    .sec-sub { font-size: 17px; }
    .stats { gap: 24px; }
    .stat b { font-size: 28px; }
    .cards { grid-template-columns: 1fr; }
    .subnav b { font-size: 19px; }
    .subnav .r span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .flowing, .pulse { animation: none; } .mini .dot { transition: none; } .pill { transition: none; } }
</style>
</head>
<body>
  <nav class="subnav">
    <b>我的倉位</b>
    <div class="r"><span id="nav-state">目前</span><button class="pill primary small" id="nav-toggle" type="button">看調整後</button></div>
  </nav>

  <!-- 區塊一：結論 -->
  <section class="tile black">
    <div class="inner">
      <p class="eyebrow">區間再平衡</p>
      <h1 class="hero-h" id="hero-h"></h1>
      <p class="lead" id="lead"></p>
      <div class="ctas">
        <button class="pill primary" id="toggle" type="button">看調整後</button>
        <button class="pill ghost" id="to-cards" type="button">看每檔怎麼調 ›</button>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <!-- 區塊二：配置流向 -->
  <section class="tile dark">
    <div class="inner">
      <h2 class="sec-h" id="flow-h">錢現在放在哪裡</h2>
      <p class="sec-sub" id="flow-sub">上排是你設定的目標，下排是目前的實際比例。彩帶越歪，代表離目標越遠。</p>
      <svg id="flow" viewBox="0 0 880 330" role="img" aria-label="目標配置與目前配置的流向圖"></svg>
      <p class="fine">紅色彩帶：比目標多或少超過 5 個百分點，需要調整。</p>
    </div>
  </section>

  <!-- 區塊三：每個板塊 -->
  <section class="tile black" id="cards-tile">
    <div class="inner">
      <h2 class="sec-h">每個板塊</h2>
      <p class="sec-sub">點一下，看每一檔要買或賣幾股。</p>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <footer><div class="inner">股數依各檔目前市值比例分配，並無條件進位，確保交易後確實回到範圍內。賣出的錢先留作現金，總值不變。範例資料，價格為虛構，僅供參考，不是投資建議。</div></footer>

<script>
(() => {
  const TOL = 5;
  const SECTORS = [
    { id: 'rocket', name: '火箭', target: 15 },
    { id: 'optics', name: '光', target: 15 },
    { id: 'software', name: '軟體', target: 20 },
    { id: 'ev', name: '電動車', target: 15 },
    { id: 'health', name: '醫療', target: 15 },
    { id: 'semis', name: '半導體', target: 20 },
  ];
  const HOLDINGS = [
    ['RKLB', 'rocket', 1000, 25], ['LUNR', 'rocket', 1500, 12],
    ['COHR', 'optics', 250, 90], ['LITE', 'optics', 125, 80],
    ['MSFT', 'software', 50, 480], ['CRM', 'software', 80, 275],
    ['TSLA', 'ev', 50, 440], ['RIVN', 'ev', 500, 14],
    ['LLY', 'health', 30, 800], ['ISRG', 'health', 19, 500],
    ['NVDA', 'semis', 200, 185], ['TSM', 'semis', 70, 260], ['AMD', 'semis', 50, 216],
  ].map(([sym, sector, shares, price]) => ({ sym, sector, shares, price }));
  const color = (i) => `var(--c${i + 1})`;
  const usd = (n) => '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
  const one = (v) => (Math.round(v * 10) / 10).toFixed(1);
  const sgn = (v) => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(1);
  let after = false, openId = 'semis', hot = null;

  function weights(hs, cash) {
    const v = {}; let total = cash || 0;
    hs.forEach((h) => { v[h.sector] = (v[h.sector] || 0) + h.shares * h.price; total += h.shares * h.price; });
    return { total, rows: SECTORS.map((s, i) => ({ ...s, i, value: v[s.id] || 0, w: total ? ((v[s.id] || 0) / total) * 100 : 0 })) };
  }
  // 超出範圍：賣回上限（或買回下限），依各檔比例分配，無條件進位成整數股
  function plan(row, total) {
    const hi = row.target + TOL, lo = Math.max(0, row.target - TOL), w = Math.round(row.w * 10) / 10;
    if (w <= hi && w >= lo) return null;
    const goal = w > hi ? hi : lo, amount = ((goal - row.w) / 100) * total;
    const list = HOLDINGS.filter((h) => h.sector === row.id);
    const sum = list.reduce((a, h) => a + h.shares * h.price, 0) || 1;
    const trades = list.map((h) => {
      let n = Math.ceil(Math.abs(amount * (h.shares * h.price) / sum) / h.price - 1e-9);
      if (amount < 0) n = Math.min(n, h.shares);
      return { sym: h.sym, n, price: h.price, side: amount < 0 ? 'sell' : 'buy', value: n * h.price };
    }).filter((t) => t.n > 0);
    const value = trades.reduce((a, t) => a + t.value, 0);
    return { side: amount < 0 ? 'sell' : 'buy', goal, trades, value, afterW: row.w + (amount < 0 ? -1 : 1) * (value / total) * 100 };
  }
  function model() {
    const B = weights(HOLDINGS);
    const plans = Object.fromEntries(B.rows.map((r) => [r.id, plan(r, B.total)]));
    const hs = HOLDINGS.map((h) => ({ ...h }));
    let cash = 0;
    Object.values(plans).forEach((p) => p && p.trades.forEach((t) => {
      const h = hs.find((x) => x.sym === t.sym);
      h.shares += t.side === 'sell' ? -t.n : t.n;
      cash += t.side === 'sell' ? t.value : -t.value;
    }));
    return { B, A: weights(hs, cash), plans, cash };
  }

  // ---------- 流向圖（無漸層、無陰影；只用實色與透明度） ----------
  const W = 880, X0 = 66, X1 = W - 4, BAR = 50, YT = 24, YB = 250;
  let shown = null;
  function drawFlow(M, bottom, cashW) {
    const span = X1 - X0, gap = 4;
    const tSum = SECTORS.reduce((a, s) => a + s.target, 0);
    const bSum = bottom.reduce((a, b) => a + b, 0) + cashW;
    let g = `<text x="0" y="${YT + BAR / 2 + 5}" class="row-lbl">目標</text><text x="0" y="${YB + BAR / 2 + 5}" class="row-lbl">${after ? '調整後' : '目前'}</text>`;
    let at = 0, ab = 0;
    const labels = [];
    SECTORS.forEach((s, i) => {
      const t0 = X0 + (at / tSum) * span, t1 = X0 + ((at + s.target) / tSum) * span;
      const b0 = X0 + (ab / bSum) * span, b1 = X0 + ((ab + bottom[i]) / bSum) * span;
      at += s.target; ab += bottom[i];
      const w = bottom[i], dev = w - s.target;
      const out = Math.abs(Math.round(w * 10) / 10 - s.target) > TOL;
      const fixed = after && M.plans[s.id];
      const yt = YT + BAR, yb = YB, my = (yt + yb) / 2;
      const ribbon = `M ${t0 + gap / 2} ${yt} C ${t0 + gap / 2} ${my}, ${b0 + gap / 2} ${my}, ${b0 + gap / 2} ${yb} L ${b1 - gap / 2} ${yb} C ${b1 - gap / 2} ${my}, ${t1 - gap / 2} ${my}, ${t1 - gap / 2} ${yt} Z`;
      const cxT = (t0 + t1) / 2, cxB = (b0 + b1) / 2;
      const rib = out ? 'var(--red)' : fixed ? 'var(--green)' : color(i);
      g += `<g class="fx${hot === s.id || openId === s.id ? ' on' : ''}" data-s="${s.id}">
        <path class="${out ? 'pulse' : ''}" d="${ribbon}" fill="${rib}" fill-opacity="${out ? .42 : fixed ? .3 : .24}"/>
        ${out ? `<path class="flowing" d="M ${cxT} ${yt + 4} C ${cxT} ${my}, ${cxB} ${my}, ${cxB} ${yb - 4}" stroke="#fff" stroke-opacity=".8" stroke-width="2.5" fill="none" stroke-linecap="round"/>` : ''}
        <rect x="${t0 + gap / 2}" y="${YT}" width="${Math.max(0, t1 - t0 - gap)}" height="${BAR}" rx="12" fill="${color(i)}"/>
        <rect x="${b0 + gap / 2}" y="${YB}" width="${Math.max(0, b1 - b0 - gap)}" height="${BAR}" rx="12" fill="${color(i)}" ${out ? 'stroke="var(--red)" stroke-width="3"' : fixed ? 'stroke="var(--green)" stroke-width="3"' : ''}/>
        ${t1 - t0 > 46 ? `<text x="${cxT}" y="${YT + 23}" text-anchor="middle" class="seg-name">${s.name}</text><text x="${cxT}" y="${YT + 40}" text-anchor="middle" class="seg-pct">${s.target}%</text>` : ''}
        ${b1 - b0 > 46 ? `<text x="${cxB}" y="${YB + 23}" text-anchor="middle" class="seg-name">${s.name}</text><text x="${cxB}" y="${YB + 40}" text-anchor="middle" class="seg-pct">${one(w)}%</text>` : ''}
      </g>`;
      const lx = (cxT + cxB) / 2;
      if (out) {
        const p = M.plans[s.id];
        labels.push(`<g pointer-events="none" transform="translate(${lx},${my})"><rect x="-84" y="-17" width="168" height="34" rx="17" fill="var(--red)"/><text text-anchor="middle" y="5" style="fill:#fff;font-weight:600;font-size:14px">${sgn(dev)} 點・${p ? (p.side === 'sell' ? '賣 ' : '買 ') + usd(p.value) : ''}</text></g>`);
      } else if (fixed) {
        labels.push(`<g pointer-events="none" transform="translate(${lx},${my})"><rect x="-54" y="-16" width="108" height="32" rx="16" fill="var(--green)"/><text text-anchor="middle" y="5" style="fill:#00230b;font-weight:600;font-size:14px">✓ ${sgn(dev)} 點</text></g>`);
      } else {
        labels.push(`<text x="${lx}" y="${my + 5}" text-anchor="middle" pointer-events="none" style="fill:rgba(255,255,255,.6);font-size:13px">${sgn(dev)}</text>`);
      }
    });
    if (cashW > 0.05) {
      const b0 = X0 + (ab / bSum) * span, b1 = X0 + ((ab + cashW) / bSum) * span;
      g += `<rect x="${b0 + 2}" y="${YB}" width="${Math.max(0, b1 - b0 - 4)}" height="${BAR}" rx="12" fill="var(--cash)"/>`;
      g += `<text x="${Math.min(b1, X1)}" y="${YB + BAR + 20}" text-anchor="end" style="fill:var(--ink-2);font-size:13px">現金 +${usd(M.cash)}</text>`;
    }
    return g + labels.join('');
  }

  // ---------- 畫面 ----------
  function render() {
    const M = model();
    const S = after ? M.A : M.B;
    const outs = M.B.rows.filter((r) => M.plans[r.id]);
    const trades = outs.reduce((a, r) => a + M.plans[r.id].trades.length, 0);
    const h = document.getElementById('hero-h'), lead = document.getElementById('lead');
    if (after) {
      h.innerHTML = `<span class="ok">調整後，每個板塊都在目標附近。</span>`;
      lead.textContent = M.cash > 0 ? `賣出的 ${usd(M.cash)} 先留作現金，總值不變。` : '不需要交易。';
    } else if (outs.length) {
      h.innerHTML = outs.map((r) => `<span class="bad">${r.name}${M.plans[r.id].side === 'sell' ? '太多了' : '太少了'}</span>`).join('、') + '。';
      lead.textContent = outs.map((r) => { const p = M.plans[r.id]; return (p.side === 'sell' ? '賣 ' : '買 ') + p.trades.map((t) => `${t.sym} ${t.n} 股`).join('、') + `，就回到 ${p.goal}% 以內`; }).join('；') + '。';
    } else {
      h.innerHTML = `<span class="ok">都很好，這次不用動。</span>`;
      lead.textContent = `每個板塊都在目標 ±${TOL} 點以內。`;
    }
    document.getElementById('stats').innerHTML = `
      <div class="stat"><small>${after ? '調整後總值' : '總值'}</small><b>${usd(S.total)}</b></div>
      <div class="stat"><small>板塊</small><b>${SECTORS.length}</b></div>
      <div class="stat"><small>${after ? '仍超出範圍' : '需要調整'}</small><b class="${after || !outs.length ? 'ok' : 'bad'}">${after ? 0 : outs.length}</b></div>
      <div class="stat"><small>${after ? '已模擬交易' : '建議交易'}</small><b>${trades} 筆</b></div>`;
    ['toggle', 'nav-toggle'].forEach((id) => {
      const t = document.getElementById(id);
      t.textContent = after ? '回到目前' : outs.length ? '看調整後' : '不需要調整';
      t.classList.toggle('done', after);
      t.classList.toggle('primary', !after);
      t.disabled = !after && !outs.length;
    });
    document.getElementById('nav-state').textContent = after ? '調整後' : '目前';
    document.getElementById('flow-h').textContent = after ? '調整後，錢會放在哪裡' : '錢現在放在哪裡';
    document.getElementById('flow-sub').textContent = after ? '下排換成照建議交易後的比例，賣出的錢先變成灰色的現金。' : '上排是你設定的目標，下排是目前的實際比例。彩帶越歪，代表離目標越遠。';
    renderCards(M);
    animateFlow(M);
  }

  let raf = null;
  function animateFlow(M) {
    const goal = (after ? M.A : M.B).rows.map((r) => r.w);
    const goalCash = after && M.cash > 0 ? (M.cash / M.A.total) * 100 : 0;
    if (!shown) shown = { w: SECTORS.map((s) => s.target), cash: 0 };
    cancelAnimationFrame(raf);
    const from = { w: shown.w.slice(), cash: shown.cash }, t0 = performance.now();
    const dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 900;
    const step = (now) => {
      const p = Math.max(0, Math.min(1, (now - t0) / dur)), e = 1 - Math.pow(1 - p, 3);
      shown = { w: from.w.map((v, i) => v + (goal[i] - v) * e), cash: from.cash + (goalCash - from.cash) * e };
      const svg = document.getElementById('flow');
      svg.innerHTML = drawFlow(M, shown.w, shown.cash);
      svg.classList.toggle('dimmed', !!hot);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  function renderCards(M) {
    document.getElementById('cards').innerHTML = M.B.rows.map((b) => {
      const a = M.A.rows.find((x) => x.id === b.id), p = M.plans[b.id];
      const w = after ? a.w : b.w, lo = Math.max(0, b.target - TOL), hi = b.target + TOL;
      const MX = Math.max(35, Math.ceil((Math.max(b.w, hi) + 3) / 5) * 5), x = (v) => (Math.max(0, Math.min(v, MX)) / MX) * 100;
      const cls = after && p ? 'fixed' : !after && p ? 'out' : '';
      const st = after && p ? `<span class="st ok">✓ 已調整</span>` : p ? `<span class="st ${p.side}">${p.side === 'sell' ? '賣' : '買'} ${usd(p.value)}</span>` : `<span class="st ok">✓ 不用動</span>`;
      return `<div class="card ${cls}${openId === b.id ? ' on' : ''}" data-s="${b.id}">
        <div class="hd"><i style="background:${color(b.i)}"></i><span class="nm">${b.name}</span>${st}</div>
        <div class="big">${one(w)}%</div>
        <div class="cap">目標 ${b.target}%・範圍 ${lo}–${hi}%・${after && p ? '原本 ' + one(b.w) + '%' : '離目標 ' + sgn(b.w - b.target) + ' 點'}</div>
        <div class="mini"><div class="tr"></div><div class="band" style="left:${x(lo)}%;width:${x(hi) - x(lo)}%"></div><div class="tg" style="left:${x(b.target)}%"></div>
          ${after && p ? `<div class="ghost" style="left:${x(b.w)}%"></div>` : ''}
          <div class="dot" style="left:${x(w)}%;background:${!after && p ? 'var(--red)' : color(b.i)}"></div></div>
        <div class="scale"><span>0%</span><span>${MX}%</span></div>
        <div class="how">${p
          ? p.trades.map((t) => `<div class="t"><b>${t.sym}</b><span class="${t.side}">${t.side === 'sell' ? '賣' : '買'} ${t.n} 股</span><small>約 ${usd(t.value)}</small></div>`).join('') +
            `<p>${p.side === 'sell' ? '賣完' : '買完'}約 ${one(p.afterW)}%，回到${p.side === 'sell' ? '上限' : '下限'} ${p.goal}% 以內。</p>`
          : `<p>在範圍內，一股都不用動。</p>`}</div>
      </div>`;
    }).join('');
  }

  ['toggle', 'nav-toggle'].forEach((id) => document.getElementById(id).addEventListener('click', () => { after = !after; render(); }));
  document.getElementById('to-cards').addEventListener('click', () => document.getElementById('cards-tile').scrollIntoView({ behavior: 'smooth' }));
  document.addEventListener('click', (e) => {
    const c = e.target.closest('[data-s]');
    if (!c) return;
    openId = openId === c.dataset.s ? null : c.dataset.s;
    render();
    if (c.closest('#flow')) document.querySelector(`.card[data-s="${c.dataset.s}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  const flow = document.getElementById('flow');
  flow.addEventListener('pointerover', (e) => { const g = e.target.closest('[data-s]'); const id = g ? g.dataset.s : null; if (id !== hot) { hot = id; flow.classList.toggle('dimmed', !!hot); flow.querySelectorAll('.fx').forEach((x) => x.classList.toggle('on', x.dataset.s === hot || x.dataset.s === openId)); } });
  flow.addEventListener('pointerleave', () => { hot = null; flow.classList.remove('dimmed'); });

  render();
})();
</script>
</body>
</html>
